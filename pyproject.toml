[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polyglot-refactor"
version = "0.1.0"
description = "Autonomous C/C++ → Rust multi-file migration agent on Nebius Token Factory + NVIDIA Nemotron"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sse-starlette>=2.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "openai>=1.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
